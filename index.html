<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Advantrix — Coming Soon</title>
<meta name="description" content="The Advantrix — digital marketing, branding, video and AI. Launching soon.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/coming-soon.css">
<script src="assets/js/coming-soon.js" defer></script>
</head>
<body>
<main class="soon">
  <video class="bg" src="assets/videos/hero-loop.mp4" poster="assets/images/hero-loop.jpg" autoplay muted loop playsinline aria-hidden="true"></video>
  <div class="in">
    <div class="brand"><svg viewBox="-390 -216 780 432" aria-hidden="true"><polygon fill="currentColor" points="-384,212 -184,212 -30,-45 -130,-211"/><polygon fill="currentColor" points="210,-211 385,-211 296,-63 121,-63"/><polygon fill="currentColor" points="-130,-211 40,-211 294,212 124,212"/></svg><span><small>The</small> Advantrix</span></div>
    <span class="tag">Launching soon</span>
    <h1>Something <b>big</b> is coming.</h1>
    <p class="lead">Digital marketing, branding, video and AI — our new home goes live in:</p>
    <div class="cd" role="timer" aria-live="off">
      <div><b id="d">20</b><span>Days</span></div>
      <div><b id="h">00</b><span>Hours</span></div>
      <div><b id="m">00</b><span>Minutes</span></div>
      <div><b id="s">00</b><span>Seconds</span></div>
    </div>
    <form id="f" novalidate><label class="sr" for="em">Email for launch updates</label><input id="em" type="email" placeholder="Your email for launch updates" autocomplete="email"><button class="btn" type="submit">Notify me</button></form>
    <p class="msg" id="msg" role="status"></p>
    <div class="extra"><button class="btn line" id="play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Watch our film</button></div>
  </div>
</main>
<dialog id="film"><button id="x" aria-label="Close film">×</button><video id="fv" src="assets/videos/film.mp4" poster="assets/images/film.jpg" controls playsinline preload="none"></video></dialog>
<div id="cur" aria-hidden="true"><div class="ring"></div><div class="ico" id="ci"></div></div>
</body>
</html>
